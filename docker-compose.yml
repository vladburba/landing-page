# docker-compose: контейнеризация статического сайта-лендинга vladburba.ru
# Вариант A: nginx:alpine в контейнере отдаёт статику, хостовый nginx (reverse-proxy)
#   проксирует на него по loopback 127.0.0.1:8080. Наружу контейнер не торчит.
# Развёрнут: 2026-06-07.
#
# Поведение отдачи 1-в-1 с прежней раздачей с диска (хостовый nginx, root=docs/):
#   index index.html;  +  try_files $uri $uri/ =404;
#   webroot = docs/  -> /CLAUDE.md, /.git/config и пр. структурно дают 404 (их нет в docs/).
# Конфиг отдачи внутри контейнера: ./nginx.conf -> /etc/nginx/conf.d/default.conf (ro).
#
# Управление: cd /opt/apps/site && sudo sudo docker compose [ps|logs|up -d|down|restart]
# Откат vhost к раздаче с диска: см. inventory services.md, раздел vladburba-site.conf.

services:
  site:
    image: nginx:alpine
    container_name: site
    restart: unless-stopped
    # строго на loopback хоста — наружу не публикуется, доступ только хостовому nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # webroot read-only: контейнер не может изменить файлы сайта
      - /opt/apps/site/docs:/usr/share/nginx/html:ro
      # свой конфиг отдачи (index + try_files =404) read-only
      - /opt/apps/site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Потолок памяти (добавлен 2026-09-03). Сайт отдаёт статику и ест ~1 МБ;
    # 64 МБ — семикратный запас. Смысл не в экономии, а в том, чтобы утечка
    # в одном контейнере не выдавила с сервера остальные: на хосте всего 1.9 ГБ.
    mem_limit: 64m
    # Проверка живости (добавлена 2026-09-03): раз в 30 секунд дёргаем nginx
    # изнутри контейнера. Три неудачи подряд — контейнер помечается unhealthy.
    # wget есть в nginx:alpine из коробки (busybox).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ротация логов как у бота (json-file, 10m x 3)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
