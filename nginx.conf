# Конфиг отдачи статики внутри контейнера site (nginx:alpine).
# Монтируется в /etc/nginx/conf.d/default.conf (ro) и ЗАМЕНЯЕТ дефолтный
# default.conf образа. Поведение 1-в-1 с прежней раздачей хостовым nginx:
#   root = /usr/share/nginx/html  (сюда смонтирован /opt/apps/site/docs)
#   index index.html;  +  try_files $uri $uri/ =404;
# TLS и server_name здесь НЕ нужны — TLS терминирует хостовый nginx,
# имя приходит в заголовке Host от reverse-proxy.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
